<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just Landed in Abu Dhabi</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Just Landed in Abu Dhabi</h1>
    <form id="question-form">
      <label for="language">Answer language</label>
      <select id="language" name="language">
        <option value="en">English</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
        <option value="ur">اردو</option>
        <option value="fr">Français</option>
      </select>
      <label for="question">Your question</label>
      <textarea id="question" name="question" rows="5" maxlength="2000" placeholder="What would you like to know?" required dir="auto"></textarea>
      <button type="submit">Get Answer</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="answer-section" hidden aria-labelledby="answer-heading">
      <h2 id="answer-heading">Answer</h2>
      <div id="answer" dir="auto"></div>
    </section>
  </main>
</body>
</html>
